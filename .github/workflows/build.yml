name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build first so compile errors are reported on their own, before the
      # slower single-file publish runs.
      - name: Build
        run: dotnet build CouchPilot.csproj -c Release --nologo

      - name: Publish single file
        run: dotnet publish CouchPilot.csproj -c Release -o publish --nologo

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          # A tag wins; otherwise take the version straight from the csproj, so
          # bumping it there is all it takes to cut a release.
          $v = "${{ github.ref_name }}"
          if ($v -match '^v\d') {
            $v = $v.TrimStart('v')
          } else {
            [xml]$proj = Get-Content CouchPilot.csproj
            $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
            if (-not $v) { $v = "0.0.0" }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Build the installer
        shell: pwsh
        env:
          COUCHPILOT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc /Qp installer\CouchPilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CouchPilot
          path: |
            publish/CouchPilot.exe
            publish/CouchPilot-Setup-*.exe
          if-no-files-found: error

      # Tag pushes are refused for this repo's app installation, so the release
      # is cut from main instead: bump <Version> in the csproj and CI publishes
      # it, tag and all, using its own token. Skipped if that tag already exists.
      - name: Does this release exist already?
        id: check
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)

          # gh leaves a non-zero exit code behind when the release is absent,
          # and the pwsh wrapper fails the whole step on it even though nothing
          # went wrong. Clear it and exit deliberately.
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "$tag is already published, nothing to do"
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "$tag is not published yet"
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && steps.check.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CouchPilot v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            publish/CouchPilot.exe
            publish/CouchPilot-Setup-*.exe

      - name: Attach to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/CouchPilot.exe
            publish/CouchPilot-Setup-*.exe
          generate_release_notes: true
