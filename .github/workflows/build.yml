name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build first so compile errors are reported on their own, before the
      # slower single-file publish step runs.
      - name: Build
        run: dotnet build CouchPilot.csproj -c Release --nologo

      - name: Publish single file
        run: dotnet publish CouchPilot.csproj -c Release -o publish --nologo

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CouchPilot
          path: publish/CouchPilot.exe
          if-no-files-found: error

      # Tagging a commit with v1.2.3 publishes a release with the exe attached.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CouchPilot.exe
          generate_release_notes: true
