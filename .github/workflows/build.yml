name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build first so compile errors are reported on their own, before the
      # slower single-file publish runs.
      - name: Build
        run: dotnet build CouchPilot.csproj -c Release --nologo

      - name: Publish single file
        run: dotnet publish CouchPilot.csproj -c Release -o publish --nologo

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v\d') { $v = "0.1.0" } else { $v = $v.TrimStart('v') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Build the installer
        shell: pwsh
        env:
          COUCHPILOT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc /Qp installer\CouchPilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CouchPilot
          path: |
            publish/CouchPilot.exe
            publish/CouchPilot-Setup-*.exe
          if-no-files-found: error

      # Tagging a commit with v1.2.3 publishes a release with both files.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/CouchPilot.exe
            publish/CouchPilot-Setup-*.exe
          generate_release_notes: true
